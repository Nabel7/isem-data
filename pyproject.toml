[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isem-data"
version = "0.1.0"
description = "Download and store Irish electricity market data (I-SEM): wind, demand and prices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nabel Sodipe" }]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7.2", "ruff>=0.6", "pre-commit>=3.5"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["isem_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
